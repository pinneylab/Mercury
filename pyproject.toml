[tool.poetry]
name = "mercury"
version = "1.3.3"
description = ""
authors = ["Nicholas-Freitas <nicholas.freitas@ucsf.edu>", "duncan-muir <muir.duncan@gmail.com>"]
readme = "README.md"

include = [
  { path = "src/mercury/db_api/units/*.txt", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.9"
numpy = ">=1.26.0"
opencv-python = ">=4.9.0"
opencv-contrib-python = ">=4.9.0"
ipywidgets = ">=8.1.0"
tqdm = ">=4.66.0"
pytest = ">=8.0.0"
basicpy = ">=1.1.0"
pillow = ">=10.2.0"
matplotlib = ">=3.8.0"
scikit-image = ">=0.22.0"
pandas = ">=2.2.0"
scipy = ">=1.11.0"
dash = ">=2.17.0"
seaborn = ">=0.13.2"
bokeh = ">=3.4.3"
pint = ">=0.24,<1"
scikit-learn = ">=1.4.0"
jupyter = ">=1.0.0"
anywidget = ">=0.9.0"
[tool.poetry.scripts]
pick-corners = "mercury.scripts.run_corner_picker:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "e2e: End-to-end tests for processing and analysis",
    "slow: Tests that take a long time to run (e.g. full raw image processing)"
]